name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel stale PR runs on new push

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0        # disable incremental to reduce cache size
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE OVERVIEW (all jobs must pass for a PR to merge)
#
#  lint ──────────────────────────────────────────────────────────────────┐
#  test (stable × Linux/macOS/Win) ──────────────────────────────────────┤
#  test-beta (Linux, catch upstream regressions early) ──────────────────┤─► required
#  test-msrv (Rust 1.75, ensure we don't use newer APIs) ───────────────┤
#  docs ──────────────────────────────────────────────────────────────────┤
#  security (cargo audit + cargo deny) ─────────────────────────────────┘
#
#  coverage (report only, non-blocking) ──────────────────────────────────── informational
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Format + Clippy + Spelling ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Formatting — fail fast, no point running clippy on unformatted code
      - name: cargo fmt
        run: cargo fmt --all --check

      # Clippy — warnings are errors; keep the codebase lint-clean
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Spell-check all source, docs, and config files
      - name: Spell check (typos)
        uses: crate-ci/typos@v1

  # ── 2. Tests — stable × Linux / macOS / Windows ──────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint              # don't waste runner minutes if lint fails
    strategy:
      fail-fast: false       # report failures from all platforms, not just the first
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (verify release compiles)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --all-features --locked

  # ── 3. Tests — Rust beta (catch upstream regressions early) ──────────────────
  test-beta:
    name: Test (beta)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true   # beta failures are informational, not blocking
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  # ── 4. Minimum Supported Rust Version (MSRV) ─────────────────────────────────
  test-msrv:
    name: Test (MSRV 1.75)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.75

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Use --locked to ensure Cargo.lock is respected
      - run: cargo test --locked

  # ── 5. Documentation ─────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Fail if any public item is missing docs or if rustdoc generates warnings
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── 6. Security audit + licence / dependency policy ──────────────────────────
  security:
    name: Security & Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo audit — checks Cargo.lock against the RustSec advisory database
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --deny warnings

      # cargo deny — licence compliance, duplicate dep detection, banned crates
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # ── 7. Code coverage (informational, non-blocking) ───────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── 8. Confirm all required jobs passed (single required check for branch protection) ──
  ci-pass:
    name: CI Pass
    if: always()
    needs: [lint, test, test-msrv, docs, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          jobs = json.load(sys.stdin)
          failed = [name for name, v in jobs.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('Failed jobs:', ', '.join(failed))
              sys.exit(1)
          print('All required jobs passed.')
          "
