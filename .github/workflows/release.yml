name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"   # e.g. v1.2.3, v1.2.3-rc.1

permissions:
  contents: write       # create GitHub releases and upload assets
  packages: write       # push to GHCR (Docker)

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: merlin

jobs:
  # ── Build matrix ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (glibc) ────────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset_name: merlin-linux-amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            asset_name: merlin-linux-arm64
            cross: true

          # ── Linux (musl — fully static, works everywhere) ───────────────────
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: merlin-linux-amd64-musl
            cross: true

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: merlin-linux-arm64-musl
            cross: true

          # ── macOS ────────────────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset_name: merlin-darwin-amd64

          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_name: merlin-darwin-arm64

          # ── Windows ──────────────────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset_name: merlin-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Install cross for Linux cross-compilation targets
      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Native build
      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}

      # Cross-compiled build
      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      # ── Package the binary ──────────────────────────────────────────────────
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             ${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" `
                    "${{ matrix.asset_name }}"

      # ── Strip + compress ────────────────────────────────────────────────────
      - name: Strip binary (Unix)
        if: runner.os != 'Windows' && matrix.cross != true
        run: strip ${{ matrix.asset_name }} || true

      - name: Compress with gzip (Unix)
        if: runner.os != 'Windows'
        run: |
          gzip --keep --best ${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          sha256sum ${{ matrix.asset_name }}.gz > ${{ matrix.asset_name }}.gz.sha256

      - name: Compress with zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.asset_name }}" `
                           -DestinationPath "${{ matrix.asset_name }}.zip"
          (Get-FileHash "${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLower() + `
            "  ${{ matrix.asset_name }}" | Out-File "${{ matrix.asset_name }}.sha256" -Encoding ascii
          (Get-FileHash "${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower() + `
            "  ${{ matrix.asset_name }}.zip" | Out-File "${{ matrix.asset_name }}.zip.sha256" -Encoding ascii

      # ── Upload artifacts for the create-release job ─────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.gz
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.asset_name }}.gz.sha256
            ${{ matrix.asset_name }}.zip.sha256
          if-no-files-found: ignore

  # ── Create GitHub release and attach all assets ──────────────────────────────
  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      # Download every artifact uploaded by the build jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List dist contents
        run: ls -lh dist/

      # Copy installer scripts into dist so they're uploaded as release assets
      - name: Add installer scripts to dist
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1

      # Extract version from tag (strip leading 'v')
      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Generate changelog from conventional commits since last tag
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "## What's changed" > changelog.md
          echo "" >> changelog.md

          git log "$RANGE" --pretty=format:"- %s (%h)" \
            --no-merges \
            | grep -E "^- (feat|fix|perf|refactor|docs|chore)" \
            >> changelog.md || true

          echo "" >> changelog.md
          echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" \
            >> changelog.md

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat changelog.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Merlin ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # rc/beta/alpha = pre-release
          files: dist/**
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker image ──────────────────────────────────────────────────────────────
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
