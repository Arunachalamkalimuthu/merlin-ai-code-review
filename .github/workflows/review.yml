name: Merlin AI Code Review
# Copy this file to your own repo's .github/workflows/ directory.
# Required secrets:
#   ANTHROPIC_API_KEY  — AI review (or OPENAI_API_KEY for GPT-4o)
#   OPENAI_API_KEY     — RAG embeddings (optional; omit to skip RAG indexing)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ── Technical specification (runs only when PR is first opened) ────────────────
  merlin-spec:
    name: Generate Technical Spec
    runs-on: ubuntu-latest
    # Only generate the spec on the very first open — not on every push
    if: github.event.action == 'opened'
    permissions:
      pull-requests: write
      contents: read

    env:
      MERLIN_VERSION: latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Merlin binary
        id: cache-merlin
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/merlin
          key: merlin-${{ env.MERLIN_VERSION }}-linux-amd64

      - name: Install Merlin
        if: steps.cache-merlin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL \
            https://github.com/Arunachalamkalimuthu/merlin-ai-code-review/releases/latest/download/install.sh \
            | MERLIN_INSTALL_DIR=~/.local/bin sh

      - name: Generate technical specification
        run: ~/.local/bin/merlin run /spec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ── Code review (runs on every push to the PR) ────────────────────────────────
  merlin-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    env:
      MERLIN_VERSION: latest   # pin to e.g. "v1.2.0" to avoid unexpected changes

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Merlin binary
        id: cache-merlin
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/merlin
          key: merlin-${{ env.MERLIN_VERSION }}-linux-amd64

      - name: Install Merlin
        if: steps.cache-merlin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL \
            https://github.com/Arunachalamkalimuthu/merlin-ai-code-review/releases/latest/download/install.sh \
            | MERLIN_INSTALL_DIR=~/.local/bin sh

      # ── RAG: cache the code index between runs ─────────────────────────────
      # The index is rebuilt only when source files change.
      # Remove this block entirely if you don't need context-aware reviews.
      - name: Cache RAG index
        if: secrets.OPENAI_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: merlin-rag.jsonl
          key: merlin-rag-${{ hashFiles('src/**', 'lib/**', '*.go', '*.py') }}
          restore-keys: merlin-rag-

      - name: Build RAG index (on cache miss)
        if: secrets.OPENAI_API_KEY != ''
        run: |
          if [ ! -f merlin-rag.jsonl ]; then
            echo "No cached index found — indexing codebase with OpenAI embeddings..."
            ~/.local/bin/merlin rag index .
          else
            echo "Using cached RAG index."
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # merlin.toml must have: [rag] enabled = true  embedder = "openai"

      # ── AI code review ─────────────────────────────────────────────────────
      - name: Run code review
        run: ~/.local/bin/merlin review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Uncomment to use OpenAI for review instead of Anthropic:
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
